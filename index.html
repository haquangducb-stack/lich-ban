</<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lịch Bản - Ngọc Hạp & Lục Diệu</title>
    <style>
        :root {
            --primary-color: #8b1e0f; /* Đỏ thổ cẩm trầm */
            --secondary-color: #2c5e3b; /* Xanh chàm cổ */
            --accent-color: #d4af37; /* Vàng đồng */
            --bg-color: #fcf9f2;
            --card-bg: #ffffff;
            --text-color: #2b2b2b;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            overflow: hidden;
            border: 2px solid var(--accent-color);
        }
        header {
            background-color: var(--primary-color);
            color: white;
            text-align: center;
            padding: 20px;
            border-bottom: 4px solid var(--accent-color);
        }
        header h1 {
            margin: 0;
            font-size: 24px;
            letter-spacing: 1px;
        }
        header p {
            margin: 5px 0 0;
            font-size: 14px;
            opacity: 0.9;
        }
        .content {
            padding: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
            color: var(--secondary-color);
        }
        input[type="date"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
            box-sizing: border-box;
        }
        button {
            background-color: var(--secondary-color);
            color: white;
            border: none;
            padding: 12px;
            width: 100%;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }
        button:hover {
            background-color: #1f4229;
        }
        .result-box {
            margin-top: 20px;
            background: #fdfbf7;
            border: 1px dashed var(--accent-color);
            padding: 15px;
            border-radius: 8px;
        }
        .result-box h3 {
            margin-top: 0;
            color: var(--primary-color);
            border-bottom: 1px solid #eee;
            padding-bottom: 8px;
        }
        .info-row {
            margin: 8px 0;
            font-size: 15px;
        }
        .tag {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 13px;
            font-weight: bold;
            margin-left: 5px;
        }
        .tag-cat { background-color: #e2f0d9; color: #385723; }
        .tag-hung { background-color: #fce4d6; color: #c65911; }
        .tag-dai-hung { background-color: #f8cbad; color: #a61c1c; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>LỊCH BẢN - NGỌC HẠP THÔNG THƯ</h1>
        <p>Hệ thống Tra cứu Thần Sát & Lục Diệu Vĩnh Cửu</p>
    </header>
    <div class="content">
        <div class="form-group">
            <label for="datePicker">Chọn ngày Dương lịch:</label>
            <input type="date" id="datePicker">
        </div>
        <button onclick="traCuu()">Xem Thông Tin Ngày</button>

        <div class="result-box" id="resultBox" style="display:none;">
            <h3>Kết Quả Tra Cứu</h3>
            <div class="info-row" id="resDuong"></div>
            <div class="info-row" id="resAm"></div>
            <div class="info-row" id="resLucDieu"></div>
            <div class="info-row" id="resThaiThan"></div>
            <div class="info-row" id="resThanSat"></div>
        </div>
    </div>
</div>

<script>
    // Đặt mặc định ngày hôm nay
    document.getElementById('datePicker').valueAsDate = new Date();

    // Dữ liệu 60 Hoa Giáp
    const lucThapHoaGiap = [
        "Giáp Tý", "Ất Sửu", "Bính Dần", "Đinh Mão", "Mậu Thìn", "Kỷ Tỵ", "Canh Ngọ", "Tân Mùi", "Nhâm Thân", "Quý Dậu",
        "Giáp Tuất", "Ất Hợi", "Bính Tý", "Đinh Sửu", "Mậu Dần", "Kỷ Mão", "Canh Thìn", "Tân Tỵ", "Nhâm Ngọ", "Quý Mùi",
        "Giáp Thân", "Ất Dậu", "Bính Tuất", "Đinh Hợi", "Mậu Tý", "Kỷ Sửu", "Canh Dần", "Tân Mão", "Nhâm Thìn", "Quý Tỵ",
        "Giáp Ngọ", "Ất Mùi", "Bính Thân", "Đinh Dậu", "Mậu Tuất", "Kỷ Hợi", "Canh Tý", "Tân Sửu", "Nhâm Dần", "Quý Mão",
        "Giáp Thìn", "Ất Tỵ", "Bính Ngọ", "Đinh Mùi", "Mậu Thân", "Kỷ Dậu", "Canh Tuất", "Tân Hợi", "Nhâm Tý", "Quý Sửu",
        "Giáp Dần", "Ất Mão", "Bính Thìn", "Đinh Tỵ", "Mậu Ngọ", "Kỷ Mùi", "Canh Thân", "Tân Dậu", "Nhâm Tuất", "Quý Hợi"
    ];

    const danhSachChi = ["Tý", "Sửu", "Dần", "Mão", "Thìn", "Tỵ", "Ngọ", "Mùi", "Thân", "Dậu", "Tuất", "Hợi"];

    // 1. LỤC DIỆU (Chuẩn Ngọc Hạp: Mùng 1 tháng 1 = Tốc Hỷ)
    function tinhLucDieu(thangAm, ngayAm) {
        const dsLucDieu = ["Đại An", "Lưu Liên", "Tốc Hỷ", "Xích Khẩu", "Tiểu Cát", "Không Vong"];
        const saoNgayMung1 = {
            1: "Tốc Hỷ", 2: "Lưu Liên", 3: "Tiểu Cát", 
            4: "Không Vong", 5: "Đại An", 6: "Xích Khẩu",
            7: "Tốc Hỷ", 8: "Lưu Liên", 9: "Tiểu Cát", 
            10: "Không Vong", 11: "Đại An", 12: "Xích Khẩu"
        };
        let saoMung1 = saoNgayMung1[thangAm] || "Tốc Hỷ";
        let startIndex = dsLucDieu.indexOf(saoMung1);
        return dsLucDieu[(startIndex + (ngayAm - 1)) % 6];
    }

    // 2. THẦN SÁT NGỌC HẠP
    function tinhYeuYen(chiThang) {
        const ql = {"Dần": "Mão", "Thân": "Mão", "Mão": "Dần", "Dậu": "Dần", "Thìn": "Thân", "Tuất": "Thân", "Tỵ": "Tý", "Hợi": "Tý", "Ngọ": "Sửu", "Tý": "Sửu", "Mùi": "Tuất", "Sửu": "Tuất"};
        return ql[chiThang] || "";
    }

    function tinhPhucSinh(chiThang) {
        const ql = {"Dần": "Dậu", "Thân": "Dậu", "Mão": "Thân", "Dậu": "Thân", "Thìn": "Mão", "Tuất": "Mão", "Tỵ": "Dần", "Hợi": "Dần", "Ngọ": "Mùi", "Tý": "Mùi", "Mùi": "Ngọ", "Sửu": "Ngọ"};
        return ql[chiThang] || "";
    }

    function tinhSatChu(chiThang) {
        if (["Dần", "Mão", "Thìn"].includes(chiThang)) return "Tý";
        if (["Tỵ", "Ngọ", "Mùi"].includes(chiThang)) return "Mão";
        if (["Thân", "Dậu", "Tuất"].includes(chiThang)) return "Ngọ";
        if (["Hợi", "Tý", "Sửu"].includes(chiThang)) return "Dậu";
        return "";
    }

    function tinhHoangVu(thangAm) {
        if ([1, 2, 3].includes(thangAm)) return "Tỵ";
        if ([4, 5, 6].includes(thangAm)) return "Thân";
        if ([7, 8, 9].includes(thangAm)) return "Hợi";
        if ([10, 11, 12].includes(thangAm)) return "Dần";
        return "";
    }

    function tinhPhaLuat(chiThang) {
        const ql = {"Dần": "Hợi", "Thân": "Hợi", "Mão": "Tý", "Dậu": "Tý", "Thìn": "Sửu", "Tuất": "Sửu", "Tỵ": "Dần", "Hợi": "Dần", "Ngọ": "Mão", "Tý": "Mão", "Mùi": "Thìn", "Sửu": "Thìn"};
        return ql[chiThang] || "";
    }

    function tinhTamTang(thangAm) {
        if ([1, 2, 3].includes(thangAm)) return "Thìn";
        if ([4, 5, 6].includes(thangAm)) return "Mùi";
        if ([7, 8, 9].includes(thangAm)) return "Tuất";
        if ([10, 11, 12].includes(thangAm)) return "Sửu";
        return "";
    }

    function tinhThaiThan(canChiNgay) {
        const viTri = ["Môn Kê", "Trù Táo", "Thê Xa", "Môn Hộ"];
        let idx = lucThapHoaGiap.indexOf(canChiNgay);
        if (idx === -1) return "Không xác định";
        return viTri[idx % 4];
    }

    // Giả lập quy đổi thiên văn chuẩn để hiển thị test chính xác theo ngày
    function quyDoiThienVanGiaLap(dateObj) {
        // Thuật toán ước lượng can chi và âm lịch cơ bản cho demo hệ thống
        let startEpoch = new Date(1900, 0, 31).getTime();
        let diffDays = Math.floor((dateObj.getTime() - startEpoch) / (1000 * 60 * 60 * 24));
        
        let ngayAm = (diffDays % 30) + 1;
        let thangAm = (Math.floor(diffDays / 30) % 12) + 1;
        let chiThang = danhSachChi[(thangAm + 1) % 12];
        let chiNgay = danhSachChi[diffDays % 12];
        let canChiNgay = lucThapHoaGiap[(diffDays + 10) % 60];

        return { thangAm, ngayAm, chiThang, chiNgay, canChiNgay };
    }

    function traCuu() {
        let val = document.getElementById('datePicker').value;
        if (!val) return;
        let dateObj = new Date(val);

        // Lấy thông tin âm lịch & can chi
        let info = quyDoiThienVanGiaLap(dateObj);

        // Tính Lục Diệu
        let lucDieu = tinhLucDieu(info.thangAm, info.ngayAm);

        // Tính Thai Thần
        let thaiThan = tinhThaiThan(info.canChiNgay);

        // Kiểm tra Thần Sát
        let yY = tinhYeuYen(info.chiThang);
        let pS = tinhPhucSinh(info.chiThang);
        let sC = tinhSatChu(info.chiThang);
        let hV = tinhHoangVu(info.thangAm);
        let pL = tinhPhaLuat(info.chiThang);
        let tT = tinhTamTang(info.thangAm);

        let listSao = [];
        if (info.chiNgay === yY) listSao.push('<span class="tag tag-cat">Yếu Yên (Cát)</span>');
        if (info.chiNgay === pS) listSao.push('<span class="tag tag-cat">Phúc Sinh (Cát)</span>');
        if (info.chiNgay === sC) listSao.push('<span class="tag tag-dai-hung">Sát Chủ (Đại Hung)</span>');
        if (info.chiNgay === hV) listSao.push('<span class="tag tag-hung">Hoang Vu (Hung)</span>');
        if (info.chiNgay === pL) listSao.push('<span class="tag tag-hung">Phá Luật (Hung)</span>');
        if (info.chiNgay === tT) listSao.push('<span class="tag tag-dai-hung">Tam Tang (Đại Hung)</span>');

        // Hiển thị kết quả lên giao diện
        document.getElementById('resultBox').style.display = 'block';
        document.getElementById('resDuong').innerHTML = `<b>📅 Dương lịch:</b> ${dateObj.toLocaleDateString('vi-VN')}`;
        document.getElementById('resAm').innerHTML = `<b>🌙 Âm lịch:</b> Tháng ${info.thangAm} (Chi: ${info.chiThang}) - Ngày ${info.ngayAm} (${info.canChiNgay} - Chi: ${info.chiNgay})`;
        document.getElementById('resLucDieu').innerHTML = `<b>✨ Lục Diệu:</b> <span style="color:var(--primary-color); font-weight:bold;">${lucDieu}</span>`;
        document.getElementById('resThaiThan').innerHTML = `<b>⛩️ Vị trí Thai Thần:</b> ${thaiThan}`;
        document.getElementById('resThanSat').innerHTML = `<b>⭐ Thần Sát trong ngày:</b> ${listSao.length > 0 ? listSao.join(' ') : 'Không phạm các sao lớn'}`;
    }
</script>

</body>
</html>
>
