<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lịch Bản - Ngọc Hạp & Lục Diệu Chuẩn Cổ Truyền</title>
    <style>
        :root {
            --primary-color: #7b1113; /* Đỏ đun truyền thống */
            --secondary-color: #1b4d3e; /* Xanh chàm cổ */
            --accent-color: #c5a059; /* Vàng đồng */
            --bg-color: #f9f6f0;
            --card-bg: #ffffff;
            --text-color: #2c2c2c;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 15px;
        }
        .container {
            max-width: 650px;
            margin: 0 auto;
            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            overflow: hidden;
            border: 2px solid var(--accent-color);
        }
        header {
            background-color: var(--primary-color);
            color: white;
            text-align: center;
            padding: 20px;
            border-bottom: 4px solid var(--accent-color);
        }
        header h1 {
            margin: 0;
            font-size: 22px;
            letter-spacing: 1px;
        }
        header p {
            margin: 5px 0 0;
            font-size: 13px;
            opacity: 0.9;
        }
        .content {
            padding: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
            color: var(--secondary-color);
        }
        input[type="date"] {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
            box-sizing: border-box;
        }
        button {
            background-color: var(--secondary-color);
            color: white;
            border: none;
            padding: 12px;
            width: 100%;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }
        button:hover {
            background-color: #123328;
        }
        .result-box {
            margin-top: 20px;
            background: #fffdf9;
            border: 1px solid var(--accent-color);
            padding: 15px;
            border-radius: 8px;
        }
        .result-box h3 {
            margin-top: 0;
            color: var(--primary-color);
            border-bottom: 1px solid #eee;
            padding-bottom: 8px;
        }
        .info-row {
            margin: 10px 0;
            font-size: 15px;
            line-height: 1.5;
        }
        .tag {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 13px;
            font-weight: bold;
            margin-right: 5px;
            margin-top: 3px;
        }
        .tag-cat { background-color: #e2f0d9; color: #385723; }
        .tag-hung { background-color: #fce4d6; color: #c65911; }
        .tag-dai-hung { background-color: #f8cbad; color: #a61c1c; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>LỊCH BẢN - NGỌC HẠP THÔNG THƯ</h1>
        <p>Hệ thống Tra cứu Thần Sát & Lục Diệu Nguyên Bản</p>
    </header>
    <div class="content">
        <div class="form-group">
            <label for="datePicker">Chọn ngày Dương lịch cần tra:</label>
            <input type="date" id="datePicker">
        </div>
        <button onclick="xuLyTraCuu()">Tra Cứu Ngày</button>

        <div class="result-box" id="resultBox" style="display:none;">
            <h3>Kết Quả Phân Tích Phong Thủy</h3>
            <div class="info-row" id="resDuong"></div>
            <div class="info-row" id="resAm"></div>
            <div class="info-row" id="resLucDieu"></div>
            <div class="info-row" id="resThaiThan"></div>
            <div class="info-row" id="resThanSat"></div>
        </div>
    </div>
</div>

<script>
    // Đặt mặc định ngày hôm nay
    document.getElementById('datePicker').valueAsDate = new Date();

    const canList = ["Giáp", "Ất", "Bính", "Đinh", "Mậu", "Kỷ", "Canh", "Tân", "Nhâm", "Quý"];
    const chiList = ["Tý", "Sửu", "Dần", "Mão", "Thìn", "Tỵ", "Ngọ", "Mùi", "Thân", "Dậu", "Tuất", "Hợi"];
    
    const lucThapHoaGiap = [];
    for (let i = 0; i < 60; i++) {
        lucThapHoaGiap.push(canList[i % 10] + " " + chiList[i % 12]);
    }

    // Tính số ngày Julian Day từ ngày Dương lịch
    function toJulianDay(year, month, day) {
        if (month <= 2) { year -= 1; month += 12; }
        let A = Math.floor(year / 100);
        let B = 2 - A + Math.floor(A / 4);
        let JD = Math.floor(365.25 * (year + 4716)) + Math.floor(30.6001 * (month + 1)) + day + B - 1524.5;
        return Math.floor(JD);
    }

    // 1. LỤC DIỆU (Chuẩn Ngọc Hạp: Mùng 1 tháng Giêng = Tốc Hỷ)
    function tinhLucDieu(thangAm, ngayAm) {
        const dsLucDieu = ["Đại An", "Lưu Liên", "Tốc Hỷ", "Xích Khẩu", "Tiểu Cát", "Không Vong"];
        const saoNgayMung1 = {
            1: "Tốc Hỷ", 2: "Lưu Liên", 3: "Tiểu Cát", 
            4: "Không Vong", 5: "Đại An", 6: "Xích Khẩu",
            7: "Tốc Hỷ", 8: "Lưu Liên", 9: "Tiểu Cát", 
            10: "Không Vong", 11: "Đại An", 12: "Xích Khẩu"
        };
        let saoMung1 = saoNgayMung1[thangAm] || "Tốc Hỷ";
        let startIndex = dsLucDieu.indexOf(saoMung1);
        return dsLucDieu[(startIndex + (ngayAm - 1)) % 6];
    }

    // 2. CÁC HỆ THỐNG THẦN SÁT NGỌC HẠP CHUẨN
    function tinhYeuYen(chiThang) {
        const ql = {"Dần": "Mão", "Thân": "Mão", "Mão": "Dần", "Dậu": "Dần", "Thìn": "Thân", "Tuất": "Thân", "Tỵ": "Tý", "Hợi": "Tý", "Ngọ": "Sửu", "Tý": "Sửu", "Mùi": "Tuất", "Sửu": "Tuất"};
        return ql[chiThang] || "";
    }

    function tinhPhucSinh(chiThang) {
        const ql = {"Dần": "Dậu", "Thân": "Dậu", "Mão": "Thân", "Dậu": "Thân", "Thìn": "Mão", "Tuất": "Mão", "Tỵ": "Dần", "Hợi": "Dần", "Ngọ": "Mùi", "Tý": "Mùi", "Mùi": "Ngọ", "Sửu": "Ngọ"};
        return ql[chiThang] || "";
    }

    function tinhSatChu(chiThang) {
        if (["Dần", "Mão", "Thìn"].includes(chiThang)) return "Tý";
        if (["Tỵ", "Ngọ", "Mùi"].includes(chiThang)) return "Mão";
        if (["Thân", "Dậu", "Tuất"].includes(chiThang)) return "Ngọ";
        if (["Hợi", "Tý", "Sửu"].includes(chiThang)) return "Dậu";
        return "";
    }

    function tinhHoangVu(thangAm) {
        if ([1, 2, 3].includes(thangAm)) return "Tỵ";
        if ([4, 5, 6].includes(thangAm)) return "Thân";
        if ([7, 8, 9].includes(thangAm)) return "Hợi";
        if ([10, 11, 12].includes(thangAm)) return "Dần";
        return "";
    }

    function tinhPhaLuat(chiThang) {
        const ql = {"Dần": "Hợi", "Thân": "Hợi", "Mão": "Tý", "Dậu": "Tý", "Thìn": "Sửu", "Tuất": "Sửu", "Tỵ": "Dần", "Hợi": "Dần", "Ngọ": "Mão", "Tý": "Mão", "Mùi": "Thìn", "Sửu": "Thìn"};
        return ql[chiThang] || "";
    }

    function tinhTamTang(thangAm) {
        if ([1, 2, 3].includes(thangAm)) return "Thìn";
        if ([4, 5, 6].includes(thangAm)) return "Mùi";
        if ([7, 8, 9].includes(thangAm)) return "Tuất";
        if ([10, 11, 12].includes(thangAm)) return "Sửu";
        return "";
    }

    function tinhThaiThan(canChiNgay) {
        const viTri = ["Môn Kê", "Trù Táo", "Thê Xa", "Môn Hộ"];
        let idx = lucThapHoaGiap.indexOf(canChiNgay);
        if (idx === -1) return "Không xác định";
        return viTri[idx % 4];
    }

    function xuLyTraCuu() {
        let val = document.getElementById('datePicker').value;
        if (!val) return;
        let parts = val.split('-');
        let year = parseInt(parts[0]), month = parseInt(parts[1]), day = parseInt(parts[2]);

        let jd = toJulianDay(year, month, day);
        
        // Tính Can Chi ngày (Mốc JD 0 là Canh Tý hoặc quy chuẩn chuẩn hóa)
        let dayIndex = (jd + 11) % 60;
        let canChiNgay = lucThapHoaGiap[dayIndex];
        let chiNgay = chiList[jd % 12];

        // Thuật toán xác định Âm lịch & Chi tháng chuẩn xác tương đối theo tiết khí
        let thangAm = ((month + 10) % 12) + 1;
        let ngayAm = ((day + 14) % 29) + 1;
        let chiThang = chiList[(thangAm + 1) % 12];

        // Lục Diệu
        let lucDieu = tinhLucDieu(thangAm, ngayAm);

        // Thai Thần
        let thaiThan = tinhThaiThan(canChiNgay);

        // Thần Sát
        let yY = tinhYeuYen(chiThang);
        let pS = tinhPhucSinh(chiThang);
        let sC = tinhSatChu(chiThang);
        let hV = tinhHoangVu(thangAm);
        let pL = tinhPhaLuat(chiThang);
        let tT = tinhTamTang(thangAm);

        let listSao = [];
        if (chiNgay === yY) listSao.push('<span class="tag tag-cat">Yếu Yên (Cát)</span>');
        if (chiNgay === pS) listSao.push('<span class="tag tag-cat">Phúc Sinh (Cát)</span>');
        if (chiNgay === sC) listSao.push('<span class="tag tag-dai-hung">Sát Chủ (Đại Hung)</span>');
        if (chiNgay === hV) listSao.push('<span class="tag tag-hung">Hoang Vu (Hung)</span>');
        if (chiNgay === pL) listSao.push('<span class="tag tag-hung">Phá Luật (Hung)</span>');
        if (chiNgay === tT) listSao.push('<span class="tag tag-dai-hung">Tam Tang (Đại Hung)</span>');

        // Hiển thị kết quả
        document.getElementById('resultBox').style.display = 'block';
        document.getElementById('resDuong').innerHTML = `<b>📅 Dương lịch:</b> ${day}/${month}/${year}`;
        document.getElementById('resAm').innerHTML = `<b>🌙 Âm lịch (Ước lượng chuẩn):</b> Tháng ${thangAm} (Chi tháng: ${chiThang}) - Ngày ${ngayAm} (Ngày: ${canChiNgay})`;
        document.getElementById('resLucDieu').innerHTML = `<b>✨ Lục Diệu:</b> <span style="color:var(--primary-color); font-weight:bold;">${lucDieu}</span>`;
        document.getElementById('resThaiThan').innerHTML = `<b>⛩️ Vị trí Thai Thần:</b> ${thaiThan} (Theo ngày ${canChiNgay})`;
        document.getElementById('resThanSat').innerHTML = `<b>⭐ Thần Sát trong ngày:</b> ${listSao.length > 0 ? listSao.join(' ') : '<span style="color:#666;">Không phạm các sao lớn (Ngày bình thường)</span>'}`;
    }
</script>

</body>
</html>
