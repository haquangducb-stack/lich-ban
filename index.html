<style>

.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cell{background:#2b1810;border:1px solid #4a2c1a;border-radius:4px;padding:4px;min-height:70px;font-size:12px}

<body>

<div id="out">Đang tải...</div>
<div class="grid" id="g"></div>

<script>

0x096d0,0x04dd5,0x04ad0,0x0a4d0,0x0d4d4,0x0d250,0x0d558,0x0b540,0x0b6a0,0x195a6,
0x095b0,0x049b0,0x0a974,0x0a4b0,0x0b27a,0x06a50,0x06d40,0x0af46,0x0ab60,0x09570,
0x04af5,0x04970,0x064b0,0x074a3,0x0ea50,0x06b58,0x055c0,0x0ab60,0x096d5,0x092e0,

0x0e968,0x0d520,0x0daa0,0x16aa6,0x056d0,0x04ae0,0x0a9d4,0x0a2d0,0x0d150,0x0f252,0x0d520];

const CAN=["Giáp","Ất","Bính","Đinh","Mậu","Kỷ","Canh","Tân","Nhâm","Quý"];
const CHI=["Tý","Sửu","Dần","Mão","Thìn","Tỵ","Ngọ","Mùi","Thân","Dậu","Tuất","Hợi"];
const LD=["Đại An","Lưu Liên","Tốc Hỷ","Xích Khẩu","Tiểu Cát","Không Vong"];
const LD_M1=[2,1,4,5,0,3,2,1,4,5,0,3];

function jd(d,m,y){const a=Math.floor((14-m)/12),yy=y+4800-a,mm=m+12*a-3;
return d+Math.floor((153*mm+2)/5)+365*yy+Math.floor(yy/4)-Math.floor(yy/100)+Math.floor(yy/400)-32045;}
function lmDays(y,m){return (LUNAR_INFO[y-1900]&(0x10000>>m))?30:29;}
function leapM(y){return LUNAR_INFO[y-1900]&0xf;}
function leapMD(y){return leapM(y)?((LUNAR_INFO[y-1900]&0x10000)?30:29):0;}
function yearDays(y){let s=348;for(let i=0x8000;i>0x8;i>>=1)s+=(LUNAR_INFO[y-1900]&i)?1:0;return s+leapMD(y);}
function s2l(d,m,y){
  let off=jd(d,m,y)-jd(31,1,1900),i,t=0;
  for(i=1900;i<2101&&off>0;i++){t=yearDays(i);off-=t;}
  if(off<0){off+=t;i--;}
  const ly=i,lp=leapM(i);let isL=false;
  for(i=1;i<13&&off>0;i++){
    if(lp>0&&i===lp+1&&!isL){--i;isL=true;t=leapMD(ly);}
    else t=lmDays(ly,i);
    if(isL&&i===lp+1)isL=false;
    off-=t;
  }
  if(off===0&&lp>0&&i===lp+1){if(isL)isL=false;else{isL=true;--i;}}
  if(off<0){off+=t;--i;}
  return{day:off+1,month:i,year:ly,isLeap:isL};
}
function ccDay(d,m,y){const idx=((jd(d,m,y)+9)%60+60)%60;return{can:CAN[idx%10],chi:CHI[idx%12],idx};}
function ld(d,lm){const i=(LD_M1[(lm-1)%12]+d-1)%6;return LD[i];}

const now=new Date();
const y=now.getFullYear(),m=now.getMonth()+1,d=now.getDate();
const lun=s2l(d,m,y);
const cc=ccDay(d,m,y);
document.getElementById("out").innerHTML=
  `Hôm nay: ${d}/${m}/${y}<br>Âm lịch: ${lun.day}/${lun.month}/${lun.year}<br>`+
  `Can Chi: ${cc.can} ${cc.chi}<br>Lục Diệu: <b>${ld(lun.day,lun.month)}</b>`;

// Vẽ lưới tháng hiện tại
const first=new Date(y,m-1,1).getDay();
const dim=new Date(y,m,0).getDate();
let html="";
for(let i=0;i<first;i++)html+='<div class="cell"></div>';
for(let i=1;i<=dim;i++){
  const L=s2l(i,m,y),C=ccDay(i,m,y);
  html+=`<div class="cell"><div class="d">${i}</div><div class="a">AL ${L.day}/${L.month}</div>`+
        `<div class="a">${C.can} ${C.chi}</div><div class="a">${ld(L.day,L.month)}</div></div>`;
}
document.getElementById("g").innerHTML=html;
</script>
</body>
